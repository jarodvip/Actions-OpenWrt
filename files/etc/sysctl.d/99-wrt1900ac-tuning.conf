# ==============================================================================
#  Linksys WRT1900AC v2 (Cobra) 运行时网络调优
#  部署位置：源码树 files/etc/sysctl.d/99-wrt1900ac-tuning.conf
#  生效方式：编译进固件，或 scp 到路由器 /etc/sysctl.d/ 后执行 sysctl -p
#
#  前提：512MB DDR3、双核 Cortex-A9、无硬件 NAT 卸载。
#  目标：在不开 flow offloading 的前提下，把千兆 NAT 与低延迟尽量兼顾。
# ==============================================================================

# ---- 连接跟踪 ----
# 默认 16384 对 P2P / BT / 几十台 IoT 明显偏小，满了会直接丢新连接。
# 512MB 内存给 65536 条完全安全（每条约 300 字节，合计不到 20MB）。
net.netfilter.nf_conntrack_max=65536
# hash 桶数建议取 max 的 1/4，减少链表长度
net.netfilter.nf_conntrack_buckets=16384
# 已建立连接默认 7440 秒（2小时）太长，半开连接堆积会拖慢查表
net.netfilter.nf_conntrack_tcp_timeout_established=3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait=60
net.netfilter.nf_conntrack_tcp_timeout_close_wait=30
net.netfilter.nf_conntrack_udp_timeout=60
net.netfilter.nf_conntrack_udp_timeout_stream=120
# 对乱序/重传更宽容，减少 NAT 下莫名丢包（OpenWrt 24+ 默认已为 1）
net.netfilter.nf_conntrack_tcp_be_liberal=1
# 不要因为 conntrack 表满就丢包，先让旧连接自然老化
net.netfilter.nf_conntrack_tcp_no_window_check=1

# ---- 队列与缓冲 ----
# DSA + 单 CPU 收包，默认 1000 在高并发 PPS 下容易溢出
net.core.netdev_max_backlog=2048
net.core.netdev_budget=600
net.core.netdev_budget_usecs=2000
# TCP 自动调优打开，缓冲区交给内核按 RTT 决定
net.ipv4.tcp_moderate_rcvbuf=1
net.ipv4.tcp_window_scaling=1
net.ipv4.tcp_timestamps=1
net.ipv4.tcp_sack=1
# 值不要盲目调大：会加重 bufferbloat。千兆以内默认档足够
net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.rmem_max=4194304
net.core.wmem_max=4194304
net.ipv4.tcp_rmem=4096 87380 4194304
net.ipv4.tcp_wmem=4096 65536 4194304

# ---- 拥塞控制 ----
# 需要固件里编了 kmod-tcp-bbr（本 .config 已含）
net.ipv4.tcp_congestion_control=bbr
net.core.default_qdisc=fq_codel

# ---- 转发与邻居表 ----
net.ipv4.ip_forward=1
net.ipv4.tcp_fastopen=3
# ARP/邻居表对多设备家庭很重要，默认 256 太小
net.ipv4.neigh.default.gc_thresh1=1024
net.ipv4.neigh.default.gc_thresh2=2048
net.ipv4.neigh.default.gc_thresh3=4096
net.ipv6.neigh.default.gc_thresh1=1024
net.ipv6.neigh.default.gc_thresh2=2048
net.ipv6.neigh.default.gc_thresh3=4096

# ---- 安全与杂项 ----
net.ipv4.conf.all.rp_filter=0
net.ipv4.conf.default.rp_filter=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.tcp_syncookies=1
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_keepalive_time=600
net.ipv4.tcp_keepalive_intvl=30
net.ipv4.tcp_keepalive_probes=5

# ---- 虚拟内存 ----
# 无 swap、无 zram，尽量不要把 dentry/inode 缓存压得太狠
vm.swappiness=0
vm.vfs_cache_pressure=100
vm.min_free_kbytes=16384

# ---- conntrack 表满时的告警阈值（便于 nlbwmon / 日志观察）----
# 用 conntrack -S 或 cat /proc/sys/net/netfilter/nf_conntrack_count 查看占用
